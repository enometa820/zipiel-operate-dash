meta: {project: zipiel-operate-dash, updated: 2026-06-27, schema_version: 1}
decisions:
  - {id: D-19, title: "밤샘 자율 루프 — 발굴→구현→검증→배포 라운드 반복", context: "사용자 '알아서 자율주행 밤샘루프' 위임. night-loop 스킬 + 다관점 워크플로우(6렌즈 병렬 진단→자율큐/승인큐 종합) 발굴 엔진", decision: "3라운드 28건 자율 구현·전부 배포. R1=KPI정직성·이중언어·성능·정리 / R2=paidAt버그·정확성·복원력·vitest·a11y·PII / R3=error.tsx·무한스피너·legacy배지·a11y. 각 라운드 tsc·vitest·lint·build·(필요시)reconcile 게이트 후 커밋·push(Vercel 자동배포). 적대적 회귀검증 PASS(0건). 안전선: 비가역·외부영향·정책필요는 승인큐 보류(코드만·외부영향0·되돌리기쉬움만 자율). 고가치 자율큐 소진 시 대기 모드(죽은재고 금지)", status: accepted, updated: 2026-06-27}
  - {id: D-22, title: "인수인계 탭 신설 + 운영 작업방식 표현 금지(앱 산출물)", context: "사용자 지시(2026-06-28) — 개발현황·인수인계 탭에 '밤샘루프·자율개선루프' 같은 작업방식 표현 금지, 다음 작업자가 이해할 작업 내용으로", decision: "/handoff 인수인계 탭(한글, 한눈에·지금데이터·기술구성·완료·다음할일·지킬규칙) 신설. status/handoff에 운영 작업방식 표현 대신 작업 내용 기재. 앱 산출물(고객사 접근)에 내부 방법론 용어·로컬경로·내부파일명 미노출", status: accepted, updated: 2026-06-28}
  - {id: D-21, title: "온에어 시트 접근 해소 — enometa OAuth 토큰(effie 불필요)", context: "온에어 시트(10ymVk)가 401(curl 무인증)로 P1-E·F 블로커였으나, 우리 운영계정 enometa@theframeless.co가 권한 보유", decision: "~/.vault/zipiel/oauth-enometa-token.json(drive/sheets readonly, refresh_token 자동갱신)로 Sheets API v4 읽기 → 무인 동기화 가능, effie 공유 요청 불필요. **gid 정정**: research 추정(1526933782=협업·1593164077=물류) 틀림 → 실제는 KR_온에어(1526933782)·CN_온에어(1593164077)·JP(268882564)·TW(1121208463)·SG(1985580167) 국가탭 + 성과분석탭(월/주/일/컨셉/라인) + 플랫폼별(TT/IG/YT). KR_온에어 44컬럼=상태·fee·CPV·송장·업로드·1/3/7일차 메트릭·조회/좋아요/댓글/리포스트/북마크/공유. PII(이메일·이름) 포함. 접근법 정본=memory onair-sheet-access", status: accepted, updated: 2026-06-28}
  - {id: D-20, title: "테스트 토대 = vitest(TS 순수함수). ETL pytest는 보류", context: "테스트 0이던 프로젝트. 회귀위험 높은 순수로직 보호 필요", decision: "vitest + grid-filters·grid-prefs 단위테스트 16건 신설(npm test). ETL pytest(map_status·to_date 등)는 etl_seeding.py main-guard 재구조화(라이브 파이프라인 실행구조 변경)가 선행이라 사용자 확인 후로 보류 — 무인 루프 리스크>가치", status: accepted, updated: 2026-06-27}
  - {id: D-1, title: "Supabase 클라우드 신규 계정", context: "enometa820 계정이 무료 2개 한도 초과, 로컬 Docker는 기동 느림", decision: "enometa@theframeless.co 새 계정 org에 seeding-ops 프로젝트(서울)", status: accepted, updated: 2026-06-25}
  - {id: D-2, title: "국가탭 전체 투입", context: "On-Air 1탭(79건)만으론 부족, 시트에 수천 크리에이터", decision: "KR·CN·JP·TW·SG·US 전 [List] 탭 통합 → 크리에이터 12,845·협업 14,110", status: accepted, updated: 2026-06-25}
  - {id: D-3, title: "앱 자체 인증 + Vercel Protection 해제", context: "매니저(sol/anna/nhi)가 Vercel 계정 없이 접속해야 함", decision: "middleware 쿠키 로그인(id/pw=theframeless!) 추가 후 Vercel ssoProtection=null", status: accepted, updated: 2026-06-25}
  - {id: D-4, title: "상태머신 effie 시트 정본 일치", context: "임의 영문 14상태가 시트 드롭다운과 불일치(스노우볼 위험)", decision: "effie 스크린샷 드롭다운 정본 15상태 EN 라벨로 전면 교체(DB enum 0003)", status: accepted, updated: 2026-06-25}
  - {id: D-5, title: "한글 개발현황 탭", context: "비개발자(effie·매니저)가 현황·진행을 이해해야 함", decision: "/status 한글 페이지(데이터현황·기능·개발로그) + NavTabs 명확 노출", status: accepted, updated: 2026-06-25}
  - {id: D-6, title: "데이터 갭은 시트 부재로 인정", context: "content 성과·SGP 절반 누락 조사 결과 시트 자체에 데이터 없음", decision: "버그 처리 대신 구조만 준비, /status에 투명 공개, 시트 채워지면 자동 반영", status: accepted, updated: 2026-06-25}
  - {id: D-7, title: "보는/하는 화면 분리", context: "운영팀 피드백 '데이터 안 맞고 UX 불편, 대시보드처럼 보고싶다'", decision: "/=Overview(매니저·effie 건강도, 가장 중요한 화면) + /board=Work board(운영자 시트형 작업면), NavTabs 3탭", status: accepted, updated: 2026-06-26}
  - {id: D-8, title: "금액은 실집행만, 제안가 총합 폐기", context: "시트 content_fee는 합의·약정·전망이 아닌 입력값 — 합산하면 '가짜 약정 2억' 함정 재발", decision: "Overview 금액=Executed fee 하나(payments paid 우선, 없으면 시트추정 라벨). fee_source 게이트(JP 참여율·TW 통화미확인 제외). 제안가(Pipeline value) 총합은 헤드라인·basis 모두 제거, 건수만", status: accepted, updated: 2026-06-26}
  - {id: D-9, title: "시트 재현+코드로 병목 해소, 가로 스크롤 지양", context: "작업자가 구글시트에 익숙(행=협업 생애주기), 칸반 카드상한이 멘탈모델과 충돌; 팀이 가로 스크롤 싫어함", decision: "Work board 기본=화면폭 fit-to-width 시트형 그리드(가로스크롤 X, 핵심 10컬럼·나머지는 Deal Page), 인라인 편집. 칸반은 Pipeline 보조탭, Table 탭 제거", status: superseded_by:D-12, updated: 2026-06-26}
  - {id: D-10, title: "합산엔 근거 동반(개발단계)", context: "개발단계라 수치가 옳은지 판단 가능해야 함", decision: "Overview 집계 금액·건수에 산출 근거(포함/제외 규칙·fee 원장) 표기 — Data basis details. scripts/diagnose_fees.py로 교차검증", status: accepted, updated: 2026-06-26}
  - {id: D-11, title: "작업면 기본 active만 로드(성능)", context: "14k 전체 조회로 board 5.4s; sourcing 86.5%가 작업면 가림", decision: "Work board 기본=sourcing 제외 active(~1.9k)만 로드(캐시·병렬조회로 빠름), ?all=1로 발굴 풀 전체. Vercel 함수 리전 icn1(서울)로 Supabase와 co-locate", status: accepted, updated: 2026-06-26}
  - {id: D-12, title: "Board 전면 재구성 — 칸반 제거·사이드바·상태그룹 시트그리드·detail 패널", context: "운영팀 피드백 '파이프라인(칸반) 이해 어렵다·가로 스크롤 불편'. BP조사(Airtable·Attio·Smartsheet): 테이블이 본체·칸반은 토글, 다상태 가로펼침이 스크롤 구조 유발", decision: "칸반 완전 제거(보조탭도 폐기). /board = 좌측 collapsible 사이드바(저장된 뷰+매니저/국가 그룹+필터) + 화면폭 fit 상태그룹(phase 기본) 시트 그리드(가로스크롤 0·첫컬럼 frozen 안전장치·밀도·컬럼 hide/reorder) + 행 클릭 우측 detail 패널(저빈도 컬럼·이력·고위험 fee/tax 편집). 데이터 계약 불변, 표현만. resize는 무가로스크롤과 상충해 제외(후속)", status: accepted, updated: 2026-06-26}
  - {id: D-13, title: "상태 라벨 한/영 병기 + 시트 정본 색 팔레트", context: "effie 실제 시트 드롭다운(user/image.png)이 한/영 병기 '한글 (English)' + per-status 색. 사용자 '한글영어 둘 다 좋다'", decision: "상태 pill·드롭다운은 한/영 병기 + effie 시트 색 팔레트(lib/status-style.ts STATUS_STYLE) 적용. 일반 페이즈 파스텔로 덮지 않음. 프로젝트 영어전용 규칙보다 사용자 지시·도메인 정본 우선(구조 UI는 영어 유지)", status: accepted, updated: 2026-06-26}
  - {id: D-14, title: "데이터 토대 스프린트 우선(작업자입력·대시보드보다 먼저)", context: "effie 새 스펙(C0BDVHVNBPS)으로 작업자 시트형 입력·대표 대시보드·시각화 다 필요. 사용자에 스코프 경계 질의 → '토대만' 선택", decision: "첫 스프린트 = etl-safe-incremental-logistics(데이터 토대만). 이유: 작업자가 시트처럼 추가해도 안 지워지려면 ETL 전량삭제부터 고쳐야 함 — 이 토대가 작업자입력·대시보드를 안전하게 만든다. 외부 의존 0. 작업자입력·분석/대시보드는 명시적 다음 스프린트", status: accepted, updated: 2026-06-26}
  - {id: D-15, title: "데이터 정본 이동 — 온에어/배송 시트, 옛 컨택리스트는 발굴풀 격하", context: "effie가 '우리의 실제 데이터'로 새 스프레드시트 2개 지정(옛 17탭 컨택리스트와 별개 ID)", decision: "정본 = 2026 논의/온에어 시트(10ymVk, 상태·계약비용·CPV·성과·제품, 401 접근필요) + [은정님,H&H] 배송 접수용(1GlDP, 물류·송장, 링크공개). 옛 컨택리스트(이미 14k DB적재)는 발굴풀(legacy)로 격하·frozen 보존. 진실 우선순위는 필드별 코드화(상태·fee=온에어, 물류=배송시트, 발굴=legacy, 실지급=재무)", status: accepted, updated: 2026-06-26}
  - {id: D-16, title: "ETL 전량삭제→멱등 upsert·출처태깅(손실0)", context: "현 ETL이 매 실행 DELETE-all+truncate로 status_history·인앱편집 파괴 — '손실없이 가져와 쓴다'와 정면충돌. 출처태깅 컬럼 0", decision: "blanket DELETE/TRUNCATE 영구 제거. 전 행 source_system·external_ref 태깅(legacy frozen 보존). 소스별 멱등 upsert(creators=handle+platform, collaborations=external_ref ON CONFLICT). 인앱 status 편집 보존(status_history changed_by!=system이면 ETL 덮지 않음). 분리축은 status 휴리스틱이 아니라 source_system. 근거 = BP data-pipeline-observability·ai-native-data-layer", status: accepted, updated: 2026-06-26}
  - {id: D-17, title: "상태 EN 라벨 'On Hold'→'Payment Pending' 정정", context: "effie 정본 m=지급 대기(Payment Pending). 0001 enum은 옳았는데 0003에서 'On Hold'로 오개명. KO('지급 대기')·페이즈(Payment)는 이미 정확", decision: "0006 마이그레이션으로 enum value rename(기존 행 자동 승계) + types.ts/status-style.ts/etl map_status 동기화. effie 15상태(a~o)와 STATUSES 1:1 확정. effie엔 '보류' 개념 없음", status: accepted, updated: 2026-06-26}
  - {id: D-18, title: "크롤링 백로그 — 엔진 분리·대시보드는 결과 적재면", context: "C0APNDK4QKW 크롤링 요청 + 사용자 'crawling 백로그, 오퍼레이트 시스템 먼저'. 기존 zipiel-instgram 크롤러 보유", decision: "크롤러 엔진은 별도 시스템(zipiel-instgram) 유지(프로젝트 CLAUDE.md '여기서 만들지 않는다'). 대시보드는 결과를 source_system='crawler' dedup 적재(crawler-result-ingestion·crawl-request-trigger, research/03 §9). 공식 Graph API는 발굴 불가(user search·팔로워리스트 폐지) — 보강(Business Discovery)만 안전. rate limit는 구조로(BP bp-anti-bot-scraping-rate-limits)", status: backlog, updated: 2026-06-26}
